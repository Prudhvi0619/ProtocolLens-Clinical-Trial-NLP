name: quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check . --exclude data --exclude artifacts
      - name: Check formatting
        run: python -m ruff format --check . --exclude data --exclude artifacts
      - name: Unit tests
        run: python -m unittest discover -s tests -v
